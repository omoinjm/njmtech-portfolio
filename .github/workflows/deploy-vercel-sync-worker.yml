name: Deploy Vercel sync worker

on:
  push:
    branches:
      - main
      - development
    paths:
      - "workers/vercel-project-sync/**"
      - ".github/workflows/deploy-vercel-sync-worker.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-vercel-sync-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy njmtech-vercel-project-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config workers/vercel-project-sync/wrangler.jsonc
