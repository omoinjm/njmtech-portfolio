services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: njmtech-portfolio
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Infisical machine identity or user token — required for `pnpm dev`
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "pnpm install && pnpm dev"

volumes:
  node_modules:
  next_cache:
